name: A股每日推荐

on:
  schedule:
    # 主触发由 Claude 定时任务负责（每个交易日 17:13 检查并触发，失败会重跑/修复）。
    # GitHub 自带定时在本仓库经常延迟 8 小时以上，这里只留一个兜底；当天已推送会自动跳过。
    - cron: "37 13 * * 1-5"  # 北京 21:37 兜底
  workflow_dispatch:
    inputs:
      force:
        description: "非交易日也强制运行（复盘最近一个交易日）"
        type: boolean
        default: false
      dry_run:
        description: "只打印卡片，不推送飞书、不写数据"
        type: boolean
        default: false
      spot_source:
        description: "行情源（auto 先东方财富失败再腾讯；tencent 直接用腾讯）"
        type: choice
        options: [auto, tencent]
        default: auto

permissions:
  contents: write

concurrency:
  group: a-share-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 恢复历史行情缓存
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}
          restore-keys: hist-
      - run: python main.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SPOT_SOURCE: ${{ github.event.inputs.spot_source }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Shanghai
      - name: 涨停复盘（单独一张飞书卡片）
        if: always()
        continue-on-error: true
        run: python limitup.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SPOT_SOURCE: ${{ github.event.inputs.spot_source }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Shanghai
      - name: 盘面数据摘要（给每日观点报告用）
        if: always()
        continue-on-error: true
        run: python market.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SPOT_SOURCE: tencent
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Shanghai
      - name: 保存历史行情缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 保存追踪数据
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase && git push
