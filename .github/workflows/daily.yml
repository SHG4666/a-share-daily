name: A股每日推荐

on:
  schedule:
    # GitHub 定时任务不保证准点，可能延迟或丢弃，所以设多个时间点兜底；
    # 当天推送成功后会写 data/last_sent.txt，后面的触发自动跳过
    - cron: "3 9 * * 1-5"    # 北京 17:03（避开整点高峰，整点最容易被延迟）
    - cron: "17 10 * * 1-5"  # 北京 18:17 兜底
    - cron: "41 11 * * 1-5"  # 北京 19:41 兜底
    - cron: "37 13 * * 1-5"  # 北京 21:37 兜底
  workflow_dispatch:
    inputs:
      force:
        description: "非交易日也强制运行（复盘最近一个交易日）"
        type: boolean
        default: false
      dry_run:
        description: "只打印卡片，不推送飞书、不写数据"
        type: boolean
        default: false
      spot_source:
        description: "行情源（auto 先东方财富失败再腾讯；tencent 直接用腾讯）"
        type: choice
        options: [auto, tencent]
        default: auto

permissions:
  contents: write

concurrency:
  group: a-share-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SPOT_SOURCE: ${{ github.event.inputs.spot_source }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Shanghai
      - name: 保存追踪数据
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase && git push
