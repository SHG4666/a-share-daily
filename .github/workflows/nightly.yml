name: 策略夜间回测

on:
  schedule:
    # 主触发由 Claude 定时任务负责（每日推送完成后触发）；这里是兜底，当天已回测会自动跳过
    - cron: "7 14 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "非交易日也运行"
        type: boolean
        default: false
      dry_run:
        description: "只打印报告，不推送飞书、不写数据"
        type: boolean
        default: false
      mode:
        description: "full：回测并推送；build：只构建/补齐全市场历史缓存；zt：只跑涨停统计"
        type: choice
        options: [full, build, zt]
        default: full
      zt_card:
        description: "涨停统计卡片今天也推送（默认只在每周最后一个交易日推送）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: a-share-daily
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 恢复历史行情缓存
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}
          restore-keys: hist-
      - run: python backtest.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SPOT_SOURCE: tencent
          BT_MODE: ${{ github.event.inputs.mode || 'full' }}
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Shanghai
      - name: 涨停统计与连板股特征
        if: always() && github.event.inputs.mode != 'build'
        continue-on-error: true
        timeout-minutes: 40
        run: python ztstats.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          ZT_CARD: ${{ github.event.inputs.zt_card == 'true' && '1' || '0' }}
          SPOT_SOURCE: tencent
          PYTHONUNBUFFERED: "1"
          TZ: Asia/Shanghai
      - name: 保存历史行情缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 保存回测结果
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "backtest: $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase && git push
